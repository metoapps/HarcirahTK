<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#C8102E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Harcırah" />
<title>Harcırah Hesabı</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root {
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --bg: #ECEEF1;
  --surface: #fff;
  --ink: #15171C;
  --sub: #626B78;
  --line: #E2E5EA;
  --field: #F5F6F8;
  --red: #C8102E;
  --redDark: #A00C24;
  --redFaint: #FBE9EC;
  --redLine: #F2D4DA;
  --ok: #1F7A4D;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 24px 16px calc(56px + env(safe-area-inset-bottom));
}
.card {
  width: 100%;
  max-width: 460px;
  background: var(--surface);
  border-radius: 20px;
  border: 1px solid var(--line);
  box-shadow: 0 8px 30px rgba(20,23,28,.06);
  padding: 22px;
}
.header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.badge {
  width: 40px; height: 40px;
  border-radius: 11px;
  background: var(--red);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(200,16,46,.30);
  flex: none;
}
h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.eyebrow {
  margin: 2px 0 0;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--red);
  text-transform: uppercase;
  letter-spacing: .08em;
}
label { display: block; font-size: 12.5px; font-weight: 600; color: var(--sub); margin: 0 0 7px; }
.select-wrap { position: relative; margin-bottom: 10px; }
select {
  width: 100%;
  appearance: none;
  -webkit-appearance: none;
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 13px 38px 13px 14px;
  font-size: 15.5px;
  font-weight: 600;
  color: var(--ink);
  font-family: var(--sans);
  cursor: pointer;
}
.chev {
  position: absolute; right: 14px; top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  color: var(--sub);
  font-size: 13px;
}
.rate-chip {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 13px; color: var(--sub);
  background: var(--redFaint);
  border: 1px solid var(--redLine);
  border-radius: 10px;
  padding: 9px 12px;
  margin-bottom: 20px;
  font-family: var(--mono);
}
.rate-chip strong { color: var(--ink); }
.rate-cur { color: var(--sub); margin-left: auto; font-family: var(--sans); font-size: 12px; }
.fields { display: grid; gap: 16px; margin-bottom: 4px; }
input[type="datetime-local"],
.try-input {
  width: 100%;
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 15px;
  color: var(--ink);
  font-family: var(--mono);
}
.hint { margin: 6px 0 0; font-size: 11.5px; color: var(--sub); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
button { border: 0; border-radius: 11px; padding: 12px 14px; font: 600 13px var(--sans); cursor: pointer; }
.primary { color: #fff; background: var(--red); }
.secondary { color: var(--ink); background: var(--field); border: 1px solid var(--line); }
button:disabled { opacity: .45; cursor: not-allowed; }
.section { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.section h2 { margin: 0; font-size: 15px; }
.section-note { margin: 0; color: var(--sub); font-size: 11.5px; }
.summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.metric { background: var(--field); border-radius: 11px; padding: 11px 12px; }
.metric-label { color: var(--sub); font-size: 11.5px; }
.metric-value { margin-top: 4px; font: 600 17px var(--mono); }
.history { display: grid; gap: 8px; margin-top: 12px; }
.history-item { display: flex; justify-content: space-between; gap: 10px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 11px; font-size: 12.5px; }
.history-main { min-width: 0; }
.history-country { font-weight: 600; }
.history-meta { margin-top: 4px; color: var(--sub); font-size: 11px; }
.history-total { white-space: nowrap; text-align: right; font: 600 13px var(--mono); }
.history-empty { color: var(--sub); font-size: 12.5px; padding: 10px 0; }
.breakdown {
  margin-top: 20px; padding: 14px;
  background: var(--field);
  border-radius: 12px;
  display: grid; gap: 9px;
}
.brow { display: flex; justify-content: space-between; font-size: 13.5px; }
.brow .k { color: var(--sub); }
.brow .v { color: var(--ink); font-weight: 500; font-family: var(--mono); }
.brow .v.strong { font-weight: 700; }
.warn {
  margin-top: 16px; padding: 12px 14px;
  font-size: 13.5px; color: var(--redDark);
  background: var(--redFaint);
  border: 1px solid var(--redLine);
  border-radius: 12px;
}
.empty {
  margin-top: 20px; padding: 26px 16px;
  text-align: center; font-size: 13.5px; color: var(--sub);
  background: var(--field);
  border-radius: 14px;
  border: 1px dashed var(--line);
}
.stub {
  margin-top: 22px;
  padding: 8px 18px 18px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 6px 20px rgba(20,23,28,.07);
  animation: rise .32s cubic-bezier(.2,.7,.2,1) both;
}
.tear {
  height: 0;
  border-top: 2px dashed var(--line);
  margin: 0 -18px 16px;
  position: relative;
  top: 8px;
}
.units-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.units-num { font-family: var(--mono); font-size: 46px; font-weight: 600; line-height: 1; color: var(--red); }
.units-cap { font-size: 12.5px; color: var(--sub); margin-top: 4px; }
.pips { display: flex; gap: 6px; flex-wrap: wrap; max-width: 130px; justify-content: flex-end; }
.pip { width: 14px; height: 22px; border-radius: 4px; background: var(--red); opacity: .9; }
.eq {
  margin-top: 16px; font-size: 13.5px; color: var(--sub);
  font-family: var(--mono);
  border-top: 1px solid var(--line);
  padding-top: 14px;
}
.total-line { display: flex; align-items: baseline; justify-content: space-between; margin-top: 6px; }
.total-lbl { font-size: 13px; font-weight: 600; color: var(--sub); }
.total-val { font-family: var(--mono); font-size: 30px; font-weight: 600; color: var(--ink); letter-spacing: -.01em; }
.total-code { font-size: 16px; color: var(--sub); font-weight: 500; }
.try-box { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.try-label { display: block; font-size: 12px; font-weight: 600; color: var(--sub); margin-bottom: 7px; }
.try-total { margin-top: 10px; font-size: 15px; font-weight: 600; color: var(--ok); font-family: var(--mono); }
input:focus-visible, select:focus-visible {
  outline: none;
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(200,16,46,.15);
}
::placeholder { color: #9AA2AD; }
@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) { .stub { animation: none; } }
</style>
</head>
<body>
<div class="card">

  <!-- Başlık -->
  <div class="header">
    <div class="badge">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 16.5 14 12V5a2 2 0 1 0-4 0v7l-7 4.5V18l7-2v3.5L8 21v1.5l4-1 4 1V21l-2-1.5V16l7 2v-1.5Z" fill="#fff"/>
      </svg>
    </div>
    <div>
      <h1>Harcırah Hesabı</h1>
      <p class="eyebrow">Kabin ekibi</p>
    </div>
  </div>

  <!-- Ülke seçimi -->
  <label for="country">Varış ülkesi</label>
  <div class="select-wrap">
    <select id="country"></select>
    <span class="chev" aria-hidden="true">▾</span>
  </div>
  <div class="rate-chip" id="rateChip"></div>

  <!-- Saat girişleri -->
  <div class="fields">
    <div>
      <label for="arrivalInput">Varış — kapı açılışı (X)</label>
      <input id="arrivalInput" type="datetime-local" />
      <p class="hint">Uçak kapısının açıldığı an</p>
    </div>
    <div>
      <label for="departureInput">Dönüş — ilk pushback (Y)</label>
      <input id="departureInput" type="datetime-local" />
      <p class="hint">Dönüş uçağının ilk hareketi</p>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="saveBtn" type="button" disabled>Görevi kaydet</button>
    <button class="secondary" id="clearBtn" type="button">Alanları temizle</button>
  </div>

  <!-- Sonuç alanı -->
  <div id="output"></div>

  <section class="section" aria-labelledby="historyTitle">
    <div class="section-head">
      <h2 id="historyTitle">Kayıtlı görevler</h2>
      <p class="section-note" id="recordCount">0 görev</p>
    </div>
    <div class="summary" id="summary"></div>
    <div class="actions">
      <button class="secondary" id="exportBtn" type="button">CSV indir</button>
      <button class="secondary" id="clearHistoryBtn" type="button">Kayıtları temizle</button>
    </div>
    <div class="history" id="history"></div>
  </section>

</div>

<script>
var COUNTRIES = [
  { name:"A.B.D",            cur:"ABD Doları",          code:"USD", rate:60   },
  { name:"Almanya",          cur:"Euro",                code:"EUR", rate:54   },
  { name:"Avustralya",       cur:"Avustralya Doları",   code:"AUD", rate:93   },
  { name:"Avusturya",        cur:"Euro",                code:"EUR", rate:55   },
  { name:"Belçika",          cur:"Euro",                code:"EUR", rate:53   },
  { name:"Danimarka",        cur:"Danimarka Kronu",     code:"DKK", rate:408  },
  { name:"Finlandiya",       cur:"Euro",                code:"EUR", rate:48   },
  { name:"Fransa",           cur:"Euro",                code:"EUR", rate:53   },
  { name:"Hollanda",         cur:"Euro",                code:"EUR", rate:52   },
  { name:"İngiltere",        cur:"İngiltere Sterlini",  code:"GBP", rate:47   },
  { name:"İrlanda",          cur:"Euro",                code:"EUR", rate:52   },
  { name:"İspanya",          cur:"Euro",                code:"EUR", rate:52   },
  { name:"İsveç",            cur:"İsveç Kronu",         code:"SEK", rate:447  },
  { name:"İsviçre",          cur:"İsviçre Frangı",      code:"CHF", rate:60   },
  { name:"İtalya",           cur:"Euro",                code:"EUR", rate:50   },
  { name:"Japonya",          cur:"Japon Yeni",          code:"JPY", rate:7000 },
  { name:"Kanada",           cur:"Kanada Doları",       code:"CAD", rate:100  },
  { name:"Kuveyt",           cur:"Kuveyt Dinarı",       code:"KWD", rate:21   },
  { name:"Lüksemburg",       cur:"Euro",                code:"EUR", rate:54   },
  { name:"Norveç",           cur:"Norveç Kronu",        code:"NOK", rate:486  },
  { name:"Portekiz",         cur:"Euro",                code:"EUR", rate:63   },
  { name:"S.Arabistan",      cur:"S.A. Riyali",         code:"SAR", rate:252  },
  { name:"Yunanistan",       cur:"Euro",                code:"EUR", rate:52   },
  { name:"Diğer AB Ülkeleri",cur:"Euro",                code:"EUR", rate:42   },
  { name:"Diğer Ülkeler",    cur:"ABD Doları",          code:"USD", rate:52   }
];

var REST_MIN = 90;
var nf  = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 0 });
var nf2 = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 2 });

function fmtDur(min) {
  var d = Math.floor(min / 1440);
  var h = Math.floor((min % 1440) / 60);
  var m = min % 60;
  var p = [];
  if (d > 0) p.push(d + " gün");
  p.push(h + " sa");
  p.push(m + " dk");
  return p.join(" ");
}

var elCountry  = document.getElementById("country");
var elChip     = document.getElementById("rateChip");
var elArrival  = document.getElementById("arrivalInput");
var elDepart   = document.getElementById("departureInput");
var elOut      = document.getElementById("output");
var elSave     = document.getElementById("saveBtn");
var elClear    = document.getElementById("clearBtn");
var elSummary  = document.getElementById("summary");
var elHistory  = document.getElementById("history");
var elCount    = document.getElementById("recordCount");
var elExport   = document.getElementById("exportBtn");
var elClearHistory = document.getElementById("clearHistoryBtn");
var tryRate    = "";
var STORAGE_KEY = "harcirahtk-gorevler-v1";
var records = loadRecords();

function loadRecords() {
  try {
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    return Array.isArray(saved) ? saved : [];
  } catch (e) { return []; }
}

function saveRecords() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

COUNTRIES.forEach(function(c, i) {
  var o = document.createElement("option");
  o.value = i;
  o.textContent = c.name;
  elCountry.appendChild(o);
});

function render() {
  var c = COUNTRIES[+elCountry.value];

  elChip.innerHTML =
    '1 birim = <strong>' + nf.format(c.rate) + ' ' + c.code + '</strong>' +
    '<span class="rate-cur">' + c.cur + '</span>';

  var av = elArrival.value;
  var dv = elDepart.value;

  if (!av || !dv) {
    elSave.disabled = true;
    elOut.innerHTML = '<div class="empty">Ülke ve saatleri gir, harcırahı hesaplayalım.</div>';
    return;
  }

  var x = new Date(av).getTime();
  var y = new Date(dv).getTime();

  if (isNaN(x) || isNaN(y)) {
    elSave.disabled = true;
    elOut.innerHTML = '<div class="empty">Ülke ve saatleri gir, harcırahı hesaplayalım.</div>';
    return;
  }

  if (y <= x) {
    elSave.disabled = true;
    elOut.innerHTML = '<div class="warn">Dönüş zamanı varıştan önce görünüyor. Saatleri kontrol et.</div>';
    return;
  }

  var grossMin = Math.round((y - x) / 60000);
  var netMin   = grossMin - REST_MIN;

  var html = '<div class="breakdown">' +
    '<div class="brow"><span class="k">Brüt yatı (Y − X)</span><span class="v">'    + fmtDur(grossMin)    + '</span></div>' +
    '<div class="brow"><span class="k">İstirahat düşümü</span><span class="v">− '   + fmtDur(REST_MIN)    + '</span></div>';

  if (netMin <= 0) {
    elSave.disabled = true;
    html += '</div><div class="warn">Net konaklama 1.5 saatin altında — harcırah oluşmayabilir. Saatleri kontrol et.</div>';
    elOut.innerHTML = html;
    return;
  }

  html += '<div class="brow"><span class="k">Net konaklama</span><span class="v strong">' + fmtDur(netMin) + '</span></div></div>';

  var units = Math.floor(netMin / 1440) + 1;
  var total = units * c.rate;
  var tnum  = parseFloat(String(tryRate).replace(",", "."));
  var tryTotal = (tnum > 0) ? total * tnum : null;

  var pips = "";
  for (var i = 0; i < units; i++) pips += '<span class="pip"></span>';

  html +=
    '<div class="stub">' +
      '<div class="tear"></div>' +
      '<div class="units-row">' +
        '<div>' +
          '<div class="units-num">' + units + '</div>' +
          '<div class="units-cap">birim harcırah</div>' +
        '</div>' +
        '<div class="pips">' + pips + '</div>' +
      '</div>' +
      '<div class="eq">' + units + ' × ' + nf.format(c.rate) + ' ' + c.code + '</div>' +
      '<div class="total-line">' +
        '<span class="total-lbl">Toplam</span>' +
        '<span class="total-val">' + nf.format(total) + ' <span class="total-code">' + c.code + '</span></span>' +
      '</div>' +
      '<div class="try-box">' +
        '<label class="try-label" for="kurInput">TL karşılığı için kur &nbsp;(1 ' + c.code + ' = ? TL)</label>' +
        '<input class="try-input" id="kurInput" type="text" inputmode="decimal" placeholder="örn. 41,50" value="' + tryRate + '" />' +
        (tryTotal !== null
          ? '<div class="try-total">' + nf.format(total) + ' ' + c.code + ' × ' + tryRate + ' ≈ ' + nf2.format(tryTotal) + ' TL</div>'
          : '') +
      '</div>' +
    '</div>';

  elOut.innerHTML = html;
  elSave.disabled = false;

  var kurEl = document.getElementById("kurInput");
  if (kurEl) {
    kurEl.addEventListener("input", function(e) {
      tryRate = e.target.value;
      render();
      var k = document.getElementById("kurInput");
      if (k) { k.focus(); var len = k.value.length; k.setSelectionRange(len, len); }
    });
  }
}

function renderHistory() {
  var count = records.length;
  elCount.textContent = count + (count === 1 ? " görev" : " görev");
  if (!count) {
    elSummary.innerHTML = '<div class="metric"><div class="metric-label">Toplam birim</div><div class="metric-value">0</div></div><div class="metric"><div class="metric-label">Toplam döviz</div><div class="metric-value">0</div></div>';
    elHistory.innerHTML = '<div class="history-empty">Kaydettiğin görevler burada görünecek.</div>';
    return;
  }
  var totalUnits = records.reduce(function(s, r) { return s + r.units; }, 0);
  var currencies = {};
  records.forEach(function(r) { currencies[r.code] = (currencies[r.code] || 0) + r.total; });
  var money = Object.keys(currencies).map(function(code) { return nf.format(currencies[code]) + " " + code; }).join(" + ");
  var tlTotal = records.reduce(function(s, r) { return s + (Number(r.tlTotal) || 0); }, 0);
  var nights = records.reduce(function(s, r) { return s + r.netMin; }, 0);
  elSummary.innerHTML = '<div class="metric"><div class="metric-label">Toplam birim</div><div class="metric-value">' + nf.format(totalUnits) + '</div></div>' +
    '<div class="metric"><div class="metric-label">Toplam döviz</div><div class="metric-value">' + money + '</div></div>' +
    '<div class="metric"><div class="metric-label">Girilen kurlarla TL</div><div class="metric-value">' + (tlTotal ? nf2.format(tlTotal) + ' TL' : '—') + '</div></div>' +
    '<div class="metric"><div class="metric-label">Net konaklama</div><div class="metric-value">' + fmtDur(nights) + '</div></div>' +
    '<div class="metric"><div class="metric-label">Ortalama görev</div><div class="metric-value">' + nf2.format(totalUnits / count) + ' birim</div></div>';
  elHistory.innerHTML = records.slice().reverse().map(function(r, index) {
    var original = records.length - 1 - index;
    var date = new Date(r.arrival).toLocaleDateString("tr-TR");
    return '<div class="history-item"><div class="history-main"><div class="history-country">' + r.country + '</div><div class="history-meta">' + date + ' · ' + r.units + ' birim · ' + fmtDur(r.netMin) + '</div></div><div class="history-total">' + nf.format(r.total) + ' ' + r.code + '<br><button class="secondary delete-record" data-index="' + original + '" type="button">Sil</button></div></div>';
  }).join("");
  document.querySelectorAll(".delete-record").forEach(function(btn) {
    btn.addEventListener("click", function() {
      records.splice(+btn.dataset.index, 1); saveRecords(); renderHistory();
    });
  });
}

elSave.addEventListener("click", function() {
  var c = COUNTRIES[+elCountry.value];
  var x = new Date(elArrival.value).getTime();
  var y = new Date(elDepart.value).getTime();
  var netMin = Math.round((y - x) / 60000) - REST_MIN;
  var units = Math.floor(netMin / 1440) + 1;
  var rateToTry = parseFloat(String(tryRate).replace(",", "."));
  records.push({ country:c.name, code:c.code, arrival:elArrival.value, netMin:netMin, units:units, total:units*c.rate, tlTotal:rateToTry > 0 ? units*c.rate*rateToTry : 0 });
  saveRecords(); renderHistory();
  elSave.textContent = "Kaydedildi ✓";
  setTimeout(function() { elSave.textContent = "Görevi kaydet"; }, 1200);
});

elClear.addEventListener("click", function() { elArrival.value = ""; elDepart.value = ""; tryRate = ""; render(); });

elExport.addEventListener("click", function() {
  if (!records.length) return;
  var rows = [["Ülke", "Tarih", "Para birimi", "Net konaklama (dk)", "Birim", "Toplam", "TL karşılığı"]];
  records.forEach(function(r) { rows.push([r.country, new Date(r.arrival).toLocaleDateString("tr-TR"), r.code, r.netMin, r.units, r.total, r.tlTotal || ""]); });
  var csv = rows.map(function(row) { return row.map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(";"); }).join("\n");
  var blob = new Blob(["\uFEFF" + csv], {type:"text/csv;charset=utf-8;"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "harcirah-kayitlari.csv"; a.click();
  URL.revokeObjectURL(a.href);
});

elClearHistory.addEventListener("click", function() {
  if (!records.length || !confirm("Tüm kayıtlı görevler silinsin mi?")) return;
  records = []; saveRecords(); renderHistory();
});

elCountry.addEventListener("change", render);
elArrival.addEventListener("input", render);
elDepart.addEventListener("input", render);
render();
renderHistory();
</script>
</body>
</html>
